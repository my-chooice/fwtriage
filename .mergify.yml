pull_request_rules:
  - name: t22-dispatch-probe
    conditions:
      - base=main
      - "label=t22-trigger"
    actions:
      github_actions:
        workflow: t22-dispatch-sink.yml


  - name: t15-a-approval-merge
    conditions:
      - "approved-reviews-by>=1"
      - "-draft"
    actions:
      merge:
        method: squash

  - name: t15-label-merge-race
    conditions:
      - "label=merge-race"
      - "-draft"
    actions:
      merge:
        method: squash

  - name: t01-f111-ctrl
    conditions:
      - number > 0
    actions:
      post_check:
        title: "PROBE_T:{{ 7*7 }}"
        summary: "PROBE_S:{{ 7*7 }} / {{ check_rule_name }}"
