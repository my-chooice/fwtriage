pull_request_rules:
  - name: t15-label-merge-race
    conditions:
      - "label=merge-race"
      - "-draft"
    actions:
      merge:
        method: squash

  - name: t01-f111-ctrl
    conditions:
      - number > 0
    actions:
      post_check:
        title: "PROBE_T:{{ 7*7 }}"
        summary: "PROBE_S:{{ 7*7 }} / {{ check_rule_name }}"
