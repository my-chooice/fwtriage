pull_request_rules:
  - name: t22-dispatch-probe
    conditions:
      - base=main
      - "label=t22-trigger"
    actions:
      github_actions:
        workflow:
          dispatch:
            - workflow: t22-dispatch-sink.yml
              inputs:
                pr_title: "{{ title }}"


  - name: t15-a-approval-merge
    conditions:
      - "approved-reviews-by>=1"
      - "-draft"
    actions:
      merge:
        method: squash

  - name: t15-label-merge-race
    conditions:
      - "label=merge-race"
      - "-draft"
    actions:
      merge:
        method: squash

  - name: t01-f111-ctrl
    conditions:
      - number > 0
    actions:
      post_check:
        title: "PROBE_T:{{ 7*7 }}"
        summary: "PROBE_S:{{ 7*7 }} / {{ check_rule_name }}"

  - name: t04-scope-gate3
    conditions:
      - "scopes=t04-gate3-scope"
    actions:
      post_check:
        title: "T04 scope found"
        summary: "scope t04-gate3-scope presente no commit"
